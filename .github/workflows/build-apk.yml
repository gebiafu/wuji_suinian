# Android Release APK 自动构建
#
# 触发方式：
#   1. 推送到 main / master 分支
#   2. 在 GitHub 仓库的 Actions 页面手动点击「Run workflow」
#
# 产物：构建完成后在该次运行的 Artifacts 中下载 app-release.apk
#（当前为 debug 签名，可直接安装到手机；上架商店需自行配置正式签名）
#
# 说明：本仓库根目录即 Flutter 项目根（pubspec.yaml 所在目录）。

name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# 同一分支的新推送会自动取消旧的进行中构建，节省 Actions 时长
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 静态分析 → 测试 → 构建 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # Gradle 9.3 + AGP 9.1 + Kotlin 2.4 需要 JDK 17+，这里用 21（LTS）
      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 版本与本地开发环境一致（Flutter 3.47.7 stable / Dart 3.13.5）
      - name: 配置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 拉取 Dart 依赖
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze

      # sqlite3 的原生构建钩子在 Linux 上会自动下载预编译库，
      # GitHub Runner 网络可以正常访问 GitHub Releases / sqlite.org。
      - name: 运行测试
        run: flutter test

      - name: 构建 Release APK
        run: flutter build apk --release

      - name: 查看 APK 产物
        run: ls -lh build/app/outputs/flutter-apk/

      # 在 Actions → 该次运行页面底部的 Artifacts 里下载
      - name: 上传 APK 到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wuji-suinian-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
